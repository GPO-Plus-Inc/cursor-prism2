name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.20.0
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test web + shared
        run: pnpm nx run-many --target=test --projects=admin,shared,mobile-offline --configuration=ci --parallel=3
      - name: Build web + api
        run: pnpm nx run-many --target=build --projects=admin,api --parallel=2
      - name: Upload admin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist/apps/admin
      - name: Upload api bundle
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: dist/apps/api
